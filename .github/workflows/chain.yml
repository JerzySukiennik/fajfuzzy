# Fajfuzzy pretraining chain in the cloud: one turn of tools/chain.py every 15 minutes, state on the chain-state branch; while the cron stalls, each run dispatches the next.
name: chain

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: chain
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: chain-state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle==2.2.4
      - name: Kaggle credentials
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          mkdir -p ~/.kaggle-gdev
          printf '%s' jerzysukienik > ~/.kaggle-gdev/username
          printf '%s' "$KAGGLE_TOKEN" > ~/.kaggle-gdev/access_token
          chmod 600 ~/.kaggle-gdev/access_token
      - name: One turn of the chain
        run: python tools/chain.py --once --state state/state.json
      - name: Save state
        if: always()
        working-directory: state
        run: |
          git config user.name "fajfuzzy-chain"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "Chain turn $(date '+%F %H:%M')" && git push -q; }
      - name: Stop when finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -e state/DONE ] || [ -e state/STOP ]; then gh workflow disable chain.yml --repo "$GITHUB_REPOSITORY"; fi
      - name: Next turn if the schedule stalls
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -e state/DONE ] || [ -e state/STOP ]; then exit 0; fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow chain.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt 2700 ]; then
            echo "no scheduled run for 45 min, dispatching the next turn in 10 min"
            sleep 600
            gh workflow run chain.yml --repo "$GITHUB_REPOSITORY"
          fi
